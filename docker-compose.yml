services:
  postgres:
    image: postgres:16
    container_name: ticketcore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticketcoredb
    ports:
      - "5432:5432"
    volumes:
      - ticketcore_pgdata:/var/lib/postgresql/data

volumes:
  ticketcore_pgdata:
